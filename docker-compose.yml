version: '3.9'

services:
  shl-recommender:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shl-recommender
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - CATALOG_PATH=/app/data/catalog.json
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
